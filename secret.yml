# Example app-level secret for the angler deployment.
#
# Postgres credentials are NOT in here — they're managed by KubeDB and
# pulled from the `postgres-angler-auth` secret (see pg.yml). This
# file only carries the application's own secret_key_base.
#
# Generate the secret_key_base with:
#
#     mix phx.gen.secret
#
# Or, if you don't have Mix on the host:
#
#     openssl rand -base64 64 | tr -d '\n'
#
# Don't commit the populated copy — `app-secrets.yml` and `*.secret.yml`
# are gitignored.

apiVersion: v1
kind: Secret
metadata:
  name: elixir-args
  namespace: angler
type: Opaque
stringData:
  # `mix phx.gen.secret` output. 64+ bytes of base64 entropy.
  secret_key_base: "a6qOBIMe2w089/Kw9Ng5WhF3HvjL812bNgSGuLiXwo8I4mzQC0s0WMYRdHEG+hih"

  # Sentry DSN — copy from your project at https://sentry.io/settings/.../keys/.
  # Leave the line out (or set the Secret key empty) to disable reporting;
  # the `optional: true` flag in app.yml means the pod still starts.
  sentry_dsn: "https://feec4dd56d0147d7b2ebe685b905e2f5@s.gmp.io/11"
