apiVersion: v1
kind: Namespace
metadata:
  name: angler
---
# RBAC for libcluster's Kubernetes strategy. The ServiceAccount on the
# pod gets read-only access to its own namespace's pods + endpoints so
# it can discover peer node IPs for Distributed Erlang.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: angler
  namespace: angler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: angler-pod-reader
  namespace: angler
rules:
  - apiGroups: [""]
    resources: ["pods", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: angler-pod-reader
  namespace: angler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: angler-pod-reader
subjects:
  - kind: ServiceAccount
    name: angler
    namespace: angler
---
# Shared, persistent storage for user uploads (MEDIA_STORAGE=local writes
# here). ReadWriteMany so both replicas — and the RollingUpdate surge pod —
# can read/write the same files; otherwise an image stored by one pod 404s
# when a later request lands on the other. openebs-zfspv is node-local, so
# the bound PV's nodeAffinity co-locates all angler pods onto its node.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: angler-uploads
  namespace: angler
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: openebs-zfspv-shared
  resources:
    requests:
      storage: 250Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: angler
  namespace: angler
  labels:
    name: angler
    keel.sh/policy: force
    keel.sh/trigger: poll
spec:
  replicas: 2
  selector:
    matchLabels:
      name: angler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        name: angler
    spec:
      serviceAccountName: angler
      # The image runs as `nobody` (uid/gid 65534). A freshly-provisioned PVC
      # is owned by root; OpenEBS ZFS LocalPV (and several other CSI drivers)
      # ignore `fsGroup` for ReadWriteMany volumes, so we explicitly chown the
      # volume in an init container that runs once as root.
      securityContext:
        fsGroup: 65534
        runAsUser: 65534
        runAsGroup: 65534
      initContainers:
        - name: chown-uploads
          image: busybox:1.36
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            ["sh", "-c", "chown -R 65534:65534 /data/uploads && chmod -R u+rwX,g+rwX /data/uploads"]
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
      containers:
        - image: r.g.gmp.io/neiam/angler:latest
          imagePullPolicy: Always
          name: angler
          ports:
            - containerPort: 4000
            # Erlang distribution: epmd (node lookup) + the pinned inet_dist
            # listener (rel/env.sh.eex) for pod-to-pod clustering.
            - { name: epmd, containerPort: 4369 }
            - { name: dist, containerPort: 9100 }
          env:
            - name: PHX_HOST
              value: angler.neiam.org
            - name: PORT
              value: "4000"
            - name: PHX_SERVER
              value: "true"
            - name: POOL_SIZE
              value: "10"

            # Local media storage root — points at the mounted uploads PVC
            # so files survive pod restarts/redeploys and are shared across
            # replicas. (Switch to MEDIA_STORAGE=s3 to drop the volume.)
            - name: MEDIA_ROOT
              value: /data/uploads

            # Cluster glue: every pod becomes angler@<pod-ip> (name
            # distribution is set from POD_IP in rel/env.sh.eex).
            # libcluster (Cluster.Strategy.Kubernetes) discovers peers
            # via the K8s API (RBAC defined above); Phoenix.PubSub then
            # fans broadcasts out across nodes. The shared cookie lets
            # them handshake.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: RELEASE_COOKIE
              valueFrom:
                secretKeyRef:
                  name: elixir-args
                  key: erlang_cookie

            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: elixir-args
                  key: secret_key_base

            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: elixir-args
                  key: sentry_dsn
                  optional: true

            # Postgres creds come from the StackGres-managed auth secret
            # (named after the SGCluster in pg.yml). runtime.exs reads
            # these directly — no URL composition — so passwords with
            # special characters don't get mangled by URL parsing.
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: angler
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: superuser-username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: superuser-password
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
          readinessProbe:
            httpGet:
              path: /
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: angler-uploads
      imagePullSecrets:
        - name: gitlabgmp
---
apiVersion: v1
kind: Service
metadata:
  name: angler-svc
  namespace: angler
spec:
  ports:
    - port: 80
      targetPort: 4000
      protocol: TCP
  selector:
    name: angler
---
# Headless service so libcluster's Kubernetes strategy can resolve all
# pod IPs for peer discovery. Pods discover siblings via this service's
# Endpoints; the actual Erlang distribution traffic flows pod-IP →
# pod-IP (4369 = epmd, 9100 = inet_dist pinned in rel/env.sh.eex).
apiVersion: v1
kind: Service
metadata:
  name: angler-headless
  namespace: angler
  # Labels here propagate to the Endpoints object. libcluster's K8s
  # strategy filters endpoints by labelSelector (not by service name),
  # so without `name: angler` here the Endpoints have no matching label
  # and discovery silently returns zero peers.
  labels:
    name: angler
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - { name: http, port: 4000, targetPort: 4000, protocol: TCP }
    - { name: epmd, port: 4369, targetPort: 4369, protocol: TCP }
    - { name: dist, port: 9100, targetPort: 9100, protocol: TCP }
  selector:
    name: angler
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: angler
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: angler-ingress
  namespace: angler
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/ingress.class: "traefik"
    # Listen on both Traefik entrypoints. The middleware below redirects
    # http → https for the `web` (port 80) entrypoint, so the app itself
    # never has to issue a 301 (which broke the LiveView WS handshake).
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: angler-redirect-https@kubernetescrd
spec:
  tls:
    - hosts:
        - angler.neiam.org
      secretName: angler-tls
  rules:
    - host: angler.neiam.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: angler-svc
                port:
                  number: 80
