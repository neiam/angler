name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

# A newer push supersedes this run: on a branch or PR the run in
# progress is cancelled; on master it finishes, and only a run still
# waiting is replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # GitHub only; the forge runs its copy in .forgejo/workflows/image.yml.
  test:
    if: github.server_url == 'https://github.com'
    # Self-hosted ARC runners (same as ../dabping). Swap for `ubuntu-latest`
    # if you'd rather use GitHub-hosted runners. The Postgres service container
    # requires the runner to support service containers (Docker/dind).
    runs-on: arc-runner-set
    env:
      MIX_ENV: test
      # This job runs on the runner itself (no `container:`), so the postgres
      # service is reached through its published port on localhost. The
      # service *name* only resolves from inside a job container, as on the
      # forge (.forgejo/workflows/image.yml uses POSTGRES_HOST: postgres); here
      # it failed with `tcp connect (postgres:5432): nxdomain`.
      POSTGRES_HOST: localhost
      # Cap the test DB pool (and, via test_helper, ExUnit's max_cases) below
      # the Postgres service's default max_connections (100). Big CI runners
      # otherwise scale the pool to cores × 2 and exhaust connections.
      POOL_SIZE: "40"
    services:
      postgres:
        image: docker.io/postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # ARC's default runner image is bare. Install:
      #   make + build-essential — native deps / Makefile-driven builds
      #   imagemagick (identify/convert/mogrify) + ffmpeg (ffmpeg/ffprobe) —
      #     the media pipeline shells out to these (Angler.Media.Workers.ImageProcess)
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends make build-essential imagemagick ffmpeg
      # Our fork of erlef/setup-beam, mirrored from the forge to GitHub
      # (GitHub only resolves owner/repo actions hosted there). It defaults
      # ImageOS to ubuntu-24.04, since the ARC runner forces an unmappable
      # ImageOS ("selfhosted") over anything a workflow sets.
      - uses: neiam/action-setup-beam@v1
        with:
          # Match the build image in the Dockerfile.
          elixir-version: "1.20.4"
          otp-version: "28.5.0.8"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - run: mix deps.get

      # `mix precommit` = compile --warnings-as-errors, deps.unlock --unused,
      # format, test (which creates + migrates the test DB). The README calls
      # this "what CI runs".
      - run: mix precommit

  # The public registries from GitHub only. The forge runs
  # .forgejo/workflows/image.yml instead (it ignores .github/workflows once
  # .forgejo/workflows exists) and publishes to its own registry.
  image:
    if: github.server_url == 'https://github.com'
    needs: test
    runs-on: arc-runner-set
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # GHCR uses the built-in GITHUB_TOKEN (needs `packages: write`, above).
      # It briefly took a GHCR_TOKEN PAT + vars.GHCR_USER instead (735e819,
      # 8c51c96), because the forge ran this file then and its own token
      # can't reach ghcr.io; the forge has its own workflow now.
      # Docker Hub and Quay need secrets set on
      # the repo (Settings → Secrets and variables → Actions):
      #   DOCKERHUB_USER / DOCKERHUB_TOKEN  (Docker Hub access token)
      #   QUAY_USERNAME / QUAY_TOKEN        (Quay robot account)
      # A missing Docker Hub / Quay login simply fails the push to that
      # registry; drop the corresponding login + `images` line to skip one.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Quay
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/neiam/angler
            quay.io/neiam/angler
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
