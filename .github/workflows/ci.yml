name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    # Self-hosted ARC runners (same as ../dabping). Swap for `ubuntu-latest`
    # if you'd rather use GitHub-hosted runners. The Postgres service container
    # requires the runner to support service containers (Docker/dind).
    runs-on: arc-runner-set
    env:
      MIX_ENV: test
      # Under forgejo-runner/act the job runs in a container, so the postgres
      # service is reached by its service name, not localhost (which works on
      # GitHub-hosted runners).
      POSTGRES_HOST: postgres
      # Cap the test DB pool (and, via test_helper, ExUnit's max_cases) below
      # the Postgres service's default max_connections (100). Big CI runners
      # otherwise scale the pool to cores × 2 and exhaust connections.
      POOL_SIZE: "40"
    services:
      postgres:
        image: docker.io/postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # ARC's default runner image is bare. Install:
      #   make + build-essential — native deps / Makefile-driven builds
      #   imagemagick (identify/convert/mogrify) + ffmpeg (ffmpeg/ffprobe) —
      #     the media pipeline shells out to these (Angler.Media.Workers.ImageProcess)
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends make build-essential imagemagick ffmpeg
      # Forge fork of erlef/setup-beam: defaults ImageOS to ubuntu-24.04,
      # since forgejo/act injects an unmappable ImageOS from the runs-on label.
      - uses: https://gg.neiam.co/neiam/action-setup-beam@v1
        with:
          # Match the build image in the Dockerfile.
          elixir-version: "1.20.4"
          otp-version: "28.5.0.8"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - run: mix deps.get

      # `mix precommit` = compile --warnings-as-errors, deps.unlock --unused,
      # format, test (which creates + migrates the test DB). The README calls
      # this "what CI runs".
      - run: mix precommit

  # The public registries from GitHub only. The forge reads
  # .github/workflows too, and there .forgejo/workflows/image.yml
  # publishes to the forge's own registry instead.
  image:
    if: github.server_url == 'https://github.com'
    needs: test
    runs-on: arc-runner-set
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # GHCR uses the built-in token. Docker Hub and Quay need secrets set on
      # the repo (Settings → Secrets and variables → Actions):
      #   DOCKERHUB_USER / DOCKERHUB_TOKEN  (Docker Hub access token)
      #   QUAY_USERNAME / QUAY_TOKEN        (Quay robot account)
      # A missing Docker Hub / Quay login simply fails the push to that
      # registry; drop the corresponding login + `images` line to skip one.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USER || github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Quay
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/neiam/angler
            quay.io/neiam/angler
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
